name: Publish Python package
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag must match package version'
          PY
      - run: python -m pip install build twine
      - run: python scripts/check_distribution.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/public-repo-release/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
